name: metanicator

services:
  backend:
    build:
      context: "https://github.com/metanotech/metanicator.git#main"
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - dokploy-network
    volumes:
      - backend_uploads:/app/data/uploads
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@shared-enviroments-metanotech-a2wcjz:5432/${POSTGRES_DB}?sslmode=disable
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${ALLOWED_ORIGINS:-}}
      MULTICA_APP_URL: ${MULTICA_APP_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      
      # SMTP Email Configuration (Hostinger / Gmail / SendGrid / Custom SMTP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_TLS_INSECURE: ${SMTP_TLS_INSECURE:-false}
      SMTP_EHLO_NAME: ${SMTP_EHLO_NAME:-}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      
      # Privacy & Registration Lockdown (Personal Use)
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      DISABLE_PUBLIC_REGISTRATION: ${DISABLE_PUBLIC_REGISTRATION:-true}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}
      DISABLE_WORKSPACE_CREATION: ${DISABLE_WORKSPACE_CREATION:-false}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      
      # Storage Configuration (RustFS / Cloudflare R2 / S3)
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-${AWS_ENDPOINT_URL:-}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${AWS_ACCESS_KEY_ID:-}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${AWS_SECRET_ACCESS_KEY:-}}
      AWS_ENDPOINT_URL: ${S3_ENDPOINT_URL:-${AWS_ENDPOINT_URL:-}}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-${AWS_ACCESS_KEY_ID:-}}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-${AWS_SECRET_ACCESS_KEY:-}}
      ATTACHMENT_DOWNLOAD_MODE: ${ATTACHMENT_DOWNLOAD_MODE:-auto}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}

  frontend:
    build:
      context: "https://github.com/metanotech/metanicator.git#main"
      dockerfile: Dockerfile.web
      args:
        REMOTE_API_URL: ${REMOTE_API_URL:-http://backend:8080}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}

    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4000}:3000"
    depends_on:
      - backend
    networks:
      - dokploy-network
    environment:
      HOSTNAME: "0.0.0.0"
      REMOTE_API_URL: ${REMOTE_API_URL:-http://backend:8080}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      DISABLE_PUBLIC_REGISTRATION: ${DISABLE_PUBLIC_REGISTRATION:-true}

volumes:
  backend_uploads:

networks:
  dokploy-network:
    external: true
